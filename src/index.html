<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模型API测试工具</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        color: #333;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      .header {
        text-align: center;
        color: white;
        margin-bottom: 30px;
      }

      .header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .main-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-bottom: 30px;
      }

      .card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .card h2 {
        color: #4a5568;
        margin-bottom: 20px;
        font-size: 1.25rem;
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 10px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #2d3748;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 14px;
        transition: all 0.3s ease;
        background: white;
      }

      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .form-group textarea {
        resize: vertical;
        min-height: 120px;
      }

      .advanced-options {
        grid-column: span 2;
      }

      .advanced-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }

      .toggle-btn {
        background: #667eea;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s ease;
        margin-bottom: 20px;
      }

      .toggle-btn:hover {
        background: #5a67d8;
        transform: translateY(-2px);
      }

      .advanced-content {
        display: none;
      }

      .advanced-content.show {
        display: block;
      }

      .send-btn {
        width: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 20px;
      }

      .send-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
      }

      .send-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .response-area {
        grid-column: span 2;
        margin-top: 20px;
      }

      .response-content {
        background: #f7fafc;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        padding: 20px;
        min-height: 200px;
        font-family: "Courier New", monospace;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 14px;
        line-height: 1.6;
      }

      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #667eea;
        font-style: italic;
      }

      .loading::after {
        content: "...";
        animation: dots 1.5s infinite;
      }

      @keyframes dots {
        0%,
        20% {
          content: ".";
        }
        40% {
          content: "..";
        }
        60%,
        100% {
          content: "...";
        }
      }

      .streaming {
        background: #e6fffa;
        border-color: #38b2ac;
        color: #234e52;
      }

      .error {
        background: #fed7d7;
        border-color: #fc8181;
        color: #c53030;
      }

      .success {
        background: #c6f6d5;
        border-color: #68d391;
        color: #22543d;
      }

      .help-text {
        font-size: 12px;
        color: #718096;
        margin-top: 5px;
      }

      .range-display {
        display: inline-block;
        margin-left: 10px;
        font-weight: bold;
        color: #667eea;
      }

      .error-highlight {
        background: #fff5f5;
        border: 1px solid #feb2b2;
        border-radius: 8px;
        padding: 15px;
        margin: 10px 0;
        font-weight: bold;
      }

      .error-status {
        color: #e53e3e;
        font-size: 18px;
        font-weight: bold;
      }

      .error-time {
        color: #d69e2e;
        font-weight: bold;
      }

      .error-response {
        background: #1a202c;
        color: #e2e8f0;
        border-radius: 6px;
        padding: 15px;
        margin: 10px 0;
        overflow-x: auto;
        font-size: 12px;
        white-space: pre-wrap;
      }

      @media (max-width: 768px) {
        .main-content {
          grid-template-columns: 1fr;
        }

        .advanced-options {
          grid-column: span 1;
        }

        .response-area {
          grid-column: span 1;
        }

        .advanced-grid {
          grid-template-columns: 1fr;
        }

        .header h1 {
          font-size: 2rem;
        }
      }

      .accordion-header {
        padding: 10px 0 12px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
      }

      .stop-btn {
        width: 100%;
        background: #e53e3e;
        color: white;
        border: none;
        padding: 15px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        display: none;
      }

      .stop-btn:hover {
        background: #c53030;
        transform: translateY(-2px);
      }

      .cancelled {
        background: #fef5e7;
        border-color: #d69e2e;
        color: #744210;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🤖 模型API测试工具</h1>
      </div>

      <div class="main-content">
        <!-- API 配置 -->
        <div class="card">
          <h2>🔧 API 配置</h2>
          <div class="form-group">
            <label for="apiUrl">API URL</label>
            <input type="text" id="apiUrl" value="" placeholder="输入模型URL" />
            <div class="help-text">AIS EIO平面外部地址</div>
          </div>
          <div class="form-group">
            <label for="apiKey">API Key</label>
            <input type="password" id="apiKey" placeholder="输入模型秘钥" />
            <div class="help-text">AIS鉴权用户配置的API秘钥</div>
          </div>
          <div class="form-group">
            <label for="model">模型名称</label>
            <input id="model" placeholder="输入模型名称" value="" />
            <div class="help-text">AIS中推理服务的模型名称</div>
          </div>
        </div>

        <!-- 消息输入 -->
        <div class="card">
          <h2>💬 消息</h2>
          <div class="form-group">
            <label for="systemMessage">系统消息 (可选)</label>
            <textarea id="systemMessage" placeholder=""></textarea>
            <div class="help-text">定义AI的角色和行为</div>
          </div>
          <div class="form-group">
            <label for="userMessage">用户消息</label>
            <textarea
              id="userMessage"
              placeholder="输入你的问题或消息..."
              required
            >
你好</textarea
            >
            <div class="help-text">你想发送给AI的消息</div>
          </div>
          <button class="send-btn" onclick="sendMessage()">🚀 发送消息</button>
          <button class="stop-btn" id="stopBtn" onclick="stopRequest()">
            ⏹️ 停止请求
          </button>
        </div>
      </div>

      <!-- 高级选项 -->
      <div class="card advanced-options">
        <div class="accordion-header" onclick="toggleAdvanced()">
          <span>⚙️显示高级参数</span>
          <span id="arrow">▼</span>
        </div>

        <div class="advanced-content" id="advancedContent">
          <div class="advanced-grid">
            <div class="form-group">
              <label for="temperature"
                >Temperature
                <span class="range-display" id="tempDisplay">1.0</span></label
              >
              <input
                type="range"
                id="temperature"
                min="0"
                max="2"
                step="0.1"
                value="0.6"
                oninput="updateDisplay('temperature', 'tempDisplay')"
              />
              <div class="help-text">控制响应的随机性 (0.0-2.0)</div>
            </div>
            <div class="form-group">
              <label for="maxTokens"
                >Max Tokens
                <span class="range-display" id="tokensDisplay">150</span></label
              >
              <input
                type="range"
                id="maxTokens"
                min="1"
                max="10000"
                step="1"
                value="4096"
                oninput="updateDisplay('maxTokens', 'tokensDisplay')"
              />
              <div class="help-text">最大生成的令牌数量</div>
            </div>
            <div class="form-group">
              <label for="topP"
                >Top P
                <span class="range-display" id="topPDisplay">1.0</span></label
              >
              <input
                type="range"
                id="topP"
                min="0"
                max="1"
                step="0.01"
                value="1.0"
                oninput="updateDisplay('topP', 'topPDisplay')"
              />
              <div class="help-text">核采样参数 (0.0-1.0)</div>
            </div>
            <div class="form-group">
              <label for="frequencyPenalty"
                >Frequency Penalty
                <span class="range-display" id="freqDisplay">0.0</span></label
              >
              <input
                type="range"
                id="frequencyPenalty"
                min="-2"
                max="2"
                step="0.1"
                value="0.0"
                oninput="updateDisplay('frequencyPenalty', 'freqDisplay')"
              />
              <div class="help-text">减少重复内容 (-2.0-2.0)</div>
            </div>
            <div class="form-group">
              <label for="presencePenalty"
                >Presence Penalty
                <span class="range-display" id="presDisplay">0.0</span></label
              >
              <input
                type="range"
                id="presencePenalty"
                min="-2"
                max="2"
                step="0.1"
                value="0.0"
                oninput="updateDisplay('presencePenalty', 'presDisplay')"
              />
              <div class="help-text">鼓励新话题 (-2.0-2.0)</div>
            </div>
            <div class="form-group">
              <label for="stream">流式响应</label>
              <select id="stream">
                <option value="false">否</option>
                <option value="true">是</option>
              </select>
              <div class="help-text">是否使用流式响应</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 响应区域 -->
      <div class="card response-area">
        <h2>📄 API 响应</h2>
        <div class="response-content" id="responseContent">等待发送请求...</div>
      </div>
    </div>

    <script>
      // 全局变量
      let abortController = null;
      let isRequestActive = false;
      let requestStartTime = null;

      // 切换高级选项显示
      function toggleAdvanced() {
        const content = document.getElementById("advancedContent");
        const arrow = document.getElementById("arrow");
        content.classList.toggle("show");
        arrow.textContent = content.classList.contains("show") ? "▲" : "▼";
      }

      // 更新滑块显示值
      function updateDisplay(sliderId, displayId) {
        const slider = document.getElementById(sliderId);
        const display = document.getElementById(displayId);
        display.textContent = slider.value;
      }

      // 停止请求（统一处理流式和非流式）
      function stopRequest() {
        if (abortController) {
          abortController.abort();
          abortController = null;
        }
        isRequestActive = false;

        const sendBtn = document.querySelector(".send-btn");
        const stopBtn = document.getElementById("stopBtn");
        const responseContent = document.getElementById("responseContent");

        sendBtn.disabled = false;
        sendBtn.textContent = "🚀 发送消息";
        stopBtn.style.display = "none";

        // 显示用户取消信息
        const responseTime = requestStartTime
          ? Date.now() - requestStartTime
          : 0;
        responseContent.className = "response-content cancelled";
        responseContent.textContent = `⏹️ 请求已被用户取消

⏱️ 请求时长：${responseTime}ms
📅 取消时间：${new Date().toLocaleString()}

ℹ️ 您可以重新发送请求`;
      }

      // 处理流式响应
      async function handleStreamResponse(
        response,
        responseElement,
        requestData
      ) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let aiResponse = "";
        let totalTokens = 0;

        responseElement.className = "response-content streaming";
        responseElement.textContent = "🤖 AI 正在回复...\n\n";

        try {
          while (true) {
            const { done, value } = await reader.read();

            if (done) break;

            // 解码数据
            buffer += decoder.decode(value, { stream: true });

            // 处理每一行数据
            const lines = buffer.split("\n");
            buffer = lines.pop() || ""; // 保留最后一行（可能不完整）

            for (const line of lines) {
              const trimmedLine = line.trim();

              if (trimmedLine === "") continue;
              if (trimmedLine === "data: [DONE]") {
                isRequestActive = false;
                return;
              }
              if (!trimmedLine.startsWith("data: ")) continue;

              try {
                const jsonStr = trimmedLine.substring(6); // 移除 'data: ' 前缀
                const data = JSON.parse(jsonStr);

                if (data.choices && data.choices[0] && data.choices[0].delta) {
                  const delta = data.choices[0].delta;

                  if (delta.content) {
                    aiResponse += delta.content;

                    // 实时更新显示
                    responseElement.textContent = `🤖 AI 正在回复...\n\n${aiResponse}`;

                    // 滚动到底部
                    responseElement.scrollTop = responseElement.scrollHeight;
                  }
                }

                // 更新token计数
                if (data.usage) {
                  totalTokens = data.usage.total_tokens;
                }
              } catch (parseError) {
                console.warn(
                  "解析SSE数据失败:",
                  parseError,
                  "line:",
                  trimmedLine
                );
              }
            }
          }
        } catch (error) {
          if (error.name === "AbortError") {
            console.log("流式传输被用户中止");
            return;
          }
          throw error;
        } finally {
          // 流式传输完成，显示最终结果
          isRequestActive = false;
          responseElement.className = "response-content success";

          const responseTime = Date.now() - requestStartTime;
          const finalContent = `✅ 流式响应完成！

🤖 AI 完整回复：
${aiResponse}

📊 使用统计：
- 总令牌数：${totalTokens || "未知"}
- 响应时间：${responseTime}ms

🔧 请求参数：
- 模型：${requestData.model}
- 温度：${requestData.temperature}
- 最大令牌：${requestData.max_tokens}
- 流式响应：是`;

          responseElement.textContent = finalContent;
        }
      }

      // 错误消息配置
      const ERROR_MESSAGES = {
        401: {
          title: "API 鉴权失败 (401)",
          message:
            "1. 确认 API Key 完整复制\n2. 检查新建用户时的代理是否和推理服务的代理一致\n",
        },
        404: {
          title: "API 端点未找到 (404)",
          message:
            "1. 检查 API URL 是否正确\n2. 检查模型名称是否正确\n3. 检查推理服务运行状态是否正常",
        },
        500: {
          title: "服务器内部错误 (500)",
          message:
            "1. 等待几分钟后重试\n2. 如果问题持续，联系 AIS 研发人员支持",
        },
        503: {
          title: "AIS流控,请求超过最大并发数 (503)",
          message:
            "1. 等待几分钟后重试\n2. 增大新建鉴权用户时的并发数配置后重试",
        },
        network: {
          title: "网络连接错误",
          message:
            "1. 确认是否使用EIO平面外部地址\n2. 确认本电脑到环境相关IP是否联通，可以使用ping测试\n3. 检查防火墙设置，是否放通推理服务端口\n",
        },
        generic: {
          title: "未知错误",
          message: "发生了未预期的错误。请检查请求参数并重试。",
        },
      };

      // 处理错误响应
      async function handleError(response, error, responseElement) {
        const responseTime = requestStartTime
          ? Date.now() - requestStartTime
          : 0;
        let statusCode = "未知";
        let rawResponse = "";
        let errorConfig;

        responseElement.className = "response-content error";

        // 获取状态码和原始响应
        if (response) {
          statusCode = response.status;
          try {
            rawResponse = await response.text();
          } catch (e) {
            rawResponse = "无法读取响应内容";
          }
        } else if (error) {
          // 网络错误等情况
          if (
            error.message.includes("Failed to fetch") ||
            error.message.includes("NetworkError")
          ) {
            statusCode = "网络错误";
            rawResponse = error.message;
          } else {
            rawResponse = error.message;
          }
        }

        // 根据状态码选择对应的错误配置
        if (statusCode === 401) {
          errorConfig = ERROR_MESSAGES[401];
        } else if (statusCode === 404) {
          errorConfig = ERROR_MESSAGES[404];
        } else if (statusCode === 500) {
          errorConfig = ERROR_MESSAGES[500];
        } else if (statusCode === 503) {
          errorConfig = ERROR_MESSAGES[503];
        } else if (statusCode === "网络错误") {
          errorConfig = ERROR_MESSAGES.network;
        } else {
          errorConfig = ERROR_MESSAGES.generic;
        }

        // 构建错误显示内容  // 📅 错误时间: ${new Date().toLocaleString()}
        const errorContent = `❌ ${errorConfig.title}

📍 关键信息：
🔴 状态码: ${statusCode}
⏱️ 响应时间: ${responseTime}ms 
🔍 原始返回内容：
${rawResponse || "无返回内容"}

🛠️  针对性解决方案：
${errorConfig.message}`;

        responseElement.textContent = errorContent;
      }

      // 发送消息到 OpenAI API
      async function sendMessage() {
        const apiUrl = document.getElementById("apiUrl").value.trim();
        const apiKey = document.getElementById("apiKey").value.trim();
        const model = document.getElementById("model").value;
        const systemMessage = document
          .getElementById("systemMessage")
          .value.trim();
        const userMessage = document.getElementById("userMessage").value.trim();
        const responseContent = document.getElementById("responseContent");
        const sendBtn = document.querySelector(".send-btn");
        const stopBtn = document.getElementById("stopBtn");
        const isStreamMode = document.getElementById("stream").value === "true";

        // 验证必填字段
        if (!apiUrl) {
          showError("请输入 API URL");
          return;
        }
        if (!apiKey) {
          showError("请输入 API Key");
          return;
        }
        if (!userMessage) {
          showError("请输入用户消息");
          return;
        }

        // 如果正在请求，先停止
        if (isRequestActive) {
          stopRequest();
          return;
        }

        // 记录请求开始时间
        requestStartTime = Date.now();

        // 设置UI状态
        sendBtn.disabled = true;
        sendBtn.textContent = isStreamMode
          ? "🔄 流式生成中..."
          : "🔄 发送中...";

        // 显示停止按钮（流式和非流式都显示）
        stopBtn.style.display = "block";
        isRequestActive = true;

        responseContent.className = "response-content loading";
        responseContent.textContent = "正在发送请求";

        // 创建新的AbortController
        abortController = new AbortController();

        try {
          // 构建消息数组
          const messages = [];
          if (systemMessage) {
            messages.push({
              role: "system",
              content: systemMessage,
            });
          }
          messages.push({
            role: "user",
            content: userMessage,
          });

          // 构建请求体
          const requestBody = {
            model: model,
            messages: messages,
            temperature: parseFloat(
              document.getElementById("temperature").value
            ),
            max_tokens: parseInt(document.getElementById("maxTokens").value),
            top_p: parseFloat(document.getElementById("topP").value),
            frequency_penalty: parseFloat(
              document.getElementById("frequencyPenalty").value
            ),
            presence_penalty: parseFloat(
              document.getElementById("presencePenalty").value
            ),
            stream: isStreamMode,
          };

          console.log("发送请求:", requestBody);

          // 发送请求
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${apiKey}`,
            },
            body: JSON.stringify(requestBody),
            signal: abortController.signal,
          });

          // 处理响应
          if (!response.ok) {
            await handleError(response, null, responseContent);
            return;
          }

          if (isStreamMode) {
            // 处理流式响应
            await handleStreamResponse(response, responseContent, requestBody);
          } else {
            // 处理非流式响应
            const data = await response.json();
            const responseTime = Date.now() - requestStartTime;

            responseContent.className = "response-content success";

            if (data.choices && data.choices.length > 0) {
              const aiResponse = data.choices[0].message.content;
              const usage = data.usage;

              responseContent.textContent = `✅ 响应成功！

🤖 AI 回复：
${aiResponse}

📊 使用统计：
- 提示令牌：${usage.prompt_tokens}
- 完成令牌：${usage.completion_tokens}
- 总令牌：${usage.total_tokens}
- 响应时间：${responseTime}ms

🔧 请求参数：
- 模型：${requestBody.model}
- 温度：${requestBody.temperature}
- 最大令牌：${requestBody.max_tokens}
- 流式响应：否

📝 完整响应数据：
${JSON.stringify(data, null, 2)}`;
            } else {
              responseContent.textContent = `⚠️ 响应格式异常：
${JSON.stringify(data, null, 2)}`;
            }
          }
        } catch (error) {
          if (error.name === "AbortError") {
            console.log("请求被用户中止");
            return;
          }

          console.error("API 请求错误:", error);
          await handleError(null, error, responseContent);
        } finally {
          // 恢复UI状态
          sendBtn.disabled = false;
          sendBtn.textContent = "🚀 发送消息";
          stopBtn.style.display = "none";
          isRequestActive = false;
          abortController = null;
        }
      }

      // 显示简单错误
      function showError(message) {
        const responseContent = document.getElementById("responseContent");
        responseContent.className = "response-content error";
        responseContent.textContent = `❌ 输入错误\n\n${message}`;
      }

      // 页面加载完成后的初始化
      document.addEventListener("DOMContentLoaded", function () {
        // 初始化显示值
        updateDisplay("temperature", "tempDisplay");
        updateDisplay("maxTokens", "tokensDisplay");
        updateDisplay("topP", "topPDisplay");
        updateDisplay("frequencyPenalty", "freqDisplay");
        updateDisplay("presencePenalty", "presDisplay");

        // 添加回车发送功能
        document
          .getElementById("userMessage")
          .addEventListener("keydown", function (e) {
            if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
              sendMessage();
            }
          });
      });
    </script>
  </body>
</html>
